[package]
name = "fountain_engine"
version = "2.1.0"
edition = "2024"
authors = ["Shenghao Yang"]
license = "MIT"
description = "Core algorithms for fountain code encoding and decoding"
repository = "https://github.com/shhyang/fountain_engine"
documentation = "https://shhyang.github.io/fountain_docs/"
keywords = ["fountain-code", "erasure-coding", "rateless", "LT-code"]
categories = ["algorithms", "encoding", "network-programming"]
readme = "README.md"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[features]
default = []

[dependencies]
smallvec = "1.13"
